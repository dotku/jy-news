name: Fetch & Translate News

on:
  schedule:
    - cron: "0 * * * *" # Every hour
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch new articles
        run: node scripts/fetch-cnbeta.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_S3_CLIENT_ENDPOINT: ${{ secrets.R2_S3_CLIENT_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCESS_KEY_SECRET: ${{ secrets.R2_ACCESS_KEY_SECRET }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      # 行业之声: leaders' direct quotes extracted from our own articles.
      # (Replaces scripts/fetch-posts.js — its nitter.net source died in Aug 2026.)
      # continue-on-error so a model/credit problem never blocks committing the
      # news; the last step still fails the run so the problem gets noticed.
      - name: Extract industry voices
        id: voices
        continue-on-error: true
        run: node scripts/extract-voices.js
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Download videos to R2
        run: |
          pip install -q yt-dlp
          node scripts/download-videos.js
        env:
          R2_S3_CLIENT_ENDPOINT: ${{ secrets.R2_S3_CLIENT_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCESS_KEY_SECRET: ${{ secrets.R2_ACCESS_KEY_SECRET }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

      - name: Translate articles
        run: node scripts/translate-articles.js
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "No new articles"
          else
            git commit -m "chore: fetch new articles $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi

      - name: Fail if industry voices extraction failed
        if: steps.voices.outcome == 'failure'
        run: |
          echo "::error::行业之声 extraction failed — see the 'Extract industry voices' step (OpenRouter credits/model?)"
          exit 1
